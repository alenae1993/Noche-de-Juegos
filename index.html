<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Noche de Juegos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
/* Layout: escenario de concurso de TV — una columna central, tarjetas tipo "letrero" y botones grandes para usar con los dedos */
:root{
  --stage:#1b1033; --stage-2:#28184a; --stage-3:#352260;
  --ink:#fff6e8; --muted:#bfaedf; --line:rgba(255,246,232,.14);
  --coral:#ff6a55; --sun:#ffc23d; --teal:#27c7b4; --blue:#5a83ff; --pink:#ff4fa3;
  --ok:#3ddc84; --bad:#ff5a5a;
  --f-display:'Bungee', 'Impact', 'Arial Black', sans-serif;
  --f-body:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--stage);
  background-image:radial-gradient(circle at 50% -10%, var(--stage-3) 0, transparent 60%);
  background-attachment:fixed;
  color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:12px 40px;
}
#app{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.1;letter-spacing:.01em}
h1{font-size:clamp(2.2rem,7vw,4.2rem)}
h2{font-size:clamp(1.5rem,4.5vw,2.3rem)}
h3{font-size:1.15rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sun);font-weight:800}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--stage-2);border:2px solid var(--line);border-radius:12px;padding:11px 14px;min-width:0}
input::placeholder{color:var(--muted)}
a{color:var(--sun)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:800;background:var(--sun);color:#2a1600;box-shadow:0 4px 0 #b5801c;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b5801c}
.btn.alt{background:var(--stage-3);color:var(--ink);box-shadow:0 4px 0 #1a0f30}
.btn.ok{background:var(--ok);color:#06290f;box-shadow:0 4px 0 #1f8a4f}
.btn.bad{background:var(--bad);color:#2d0505;box-shadow:0 4px 0 #a52f2f}
.btn.big{font-size:1.15rem;padding:16px 26px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.center{justify-content:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--stage-2);border:1px solid var(--line);border-radius:var(--r);padding:20px}

/* barra superior */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.logo{font-family:var(--f-display);font-size:1.25rem;color:var(--sun);letter-spacing:.02em}
.logo span{color:var(--pink)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--stage-3);font-size:.85rem;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

/* portada */
.hero{text-align:center;padding:26px 0 6px;display:flex;flex-direction:column;gap:10px;align-items:center}
.hero h1{color:var(--sun);text-shadow:0 5px 0 var(--coral)}
.hero h1 em{font-style:normal;color:var(--ink);text-shadow:0 5px 0 var(--pink)}
.bulbs{display:flex;gap:10px}
.bulbs i{width:12px;height:12px;border-radius:50%;background:var(--sun);box-shadow:0 0 12px var(--sun);animation:blink 1.6s infinite}
.bulbs i:nth-child(2n){animation-delay:.8s;background:var(--pink);box-shadow:0 0 12px var(--pink)}
@keyframes blink{50%{opacity:.25}}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.mode{text-align:left;background:var(--stage-2);border:2px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s, transform .15s}
.mode:hover{border-color:var(--sun);transform:translateY(-2px)}
.mode h3{color:var(--sun)}
.mode.off{opacity:.5}
.toggle{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.sw{width:52px;height:30px;border-radius:999px;background:var(--stage-3);position:relative;transition:background .15s;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:left .15s}
.toggle.on .sw{background:var(--pink)}
.toggle.on .sw::after{left:26px}

/* jugadores */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--stage-3);font-weight:600;border:2px solid transparent}
.chip.sel{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%, var(--stage-3))}
.chip .x{opacity:.6;font-weight:800}
.code{font-family:var(--f-display);font-size:clamp(3rem,12vw,6rem);letter-spacing:.12em;color:var(--sun);line-height:1}

/* menú de juegos */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.game{text-align:left;border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px;min-height:170px;position:relative;overflow:hidden;color:#1b1033;transition:transform .15s}
.game:hover{transform:translateY(-3px) rotate(-.4deg)}
.game h3{font-size:1.25rem}
.game p{font-size:.92rem;font-weight:600;opacity:.85}
.game .tags{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px}
.game .tags span{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;background:rgba(27,16,51,.15);padding:3px 8px;border-radius:999px}
.game .glyph{position:absolute;right:-8px;top:-14px;font-family:var(--f-display);font-size:4.6rem;opacity:.16}

/* escenario de juego */
.stagebox{background:var(--stage-2);border:1px solid var(--line);border-radius:22px;padding:clamp(16px,3vw,30px);display:flex;flex-direction:column;gap:18px}
.q{font-family:var(--f-body);font-weight:800;font-size:clamp(1.4rem,3.6vw,2.4rem);line-height:1.2;text-wrap:balance}
.timer{font-family:var(--f-display);font-size:2.2rem;color:var(--sun);font-variant-numeric:tabular-nums;min-width:3ch;text-align:center}
.timer.low{color:var(--bad);animation:blink .5s infinite}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.opt{display:flex;align-items:center;gap:12px;padding:18px;border-radius:16px;font-weight:800;font-size:clamp(1rem,2.4vw,1.35rem);color:#1b1033;text-align:left;min-height:72px}
.opt .k{font-family:var(--f-display);font-size:1.4rem;width:44px;height:44px;border-radius:12px;background:rgba(27,16,51,.18);display:grid;place-items:center;flex:none}
.c0{background:var(--coral)}.c1{background:var(--sun)}.c2{background:var(--teal)}.c3{background:var(--blue)}
.opt.dim{opacity:.25}
.opt.win{outline:5px solid var(--ink);transform:scale(1.02)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--stage-3);font-weight:600}
.li b{margin-left:auto;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:999px;background:var(--pink)}
.big-word{font-family:var(--f-display);font-size:clamp(2rem,8vw,4rem);color:var(--sun);text-align:center;line-height:1.05;word-break:break-word}
.cover{position:fixed;inset:0;background:var(--stage);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));text-align:center}

/* marcador */
.score-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--stage-3)}
.score-row .pts{font-family:var(--f-display);font-size:1.4rem;font-variant-numeric:tabular-nums;color:var(--sun)}
.rank{font-family:var(--f-display);width:2ch;color:var(--muted)}
.mini{width:36px;height:36px;border-radius:10px;background:var(--stage-2);font-weight:800}

/* rosco */
.rosco-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;align-items:center}
.rosco{width:100%;max-width:440px;margin:0 auto;aspect-ratio:1;display:block}
.rosco text{font-family:var(--f-display);font-size:15px}

/* 100 chilenos */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.tile{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;background:var(--blue);color:#0b1640;font-weight:800;font-size:1.15rem;min-height:58px;text-align:left}
.tile .n{font-family:var(--f-display);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(11,22,64,.2);flex:none}
.tile .p{margin-left:auto;font-family:var(--f-display);font-size:1.3rem}
.tile.hid{background:var(--stage-3);color:var(--muted)}
.tile.flip{animation:flip .45s}
@keyframes flip{0%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.strikes{display:flex;gap:8px}
.strikes span{font-family:var(--f-display);font-size:2.2rem;color:var(--stage-3)}
.strikes span.on{color:var(--bad)}
.bigx{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:40;font-family:var(--f-display);font-size:min(60vw,22rem);color:var(--bad);animation:xpop .9s forwards}
@keyframes xpop{0%{transform:scale(.4);opacity:0}25%{transform:scale(1.05);opacity:1}80%{opacity:1}100%{opacity:0}}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.team{padding:14px;border-radius:14px;background:var(--stage-3);display:flex;flex-direction:column;gap:2px;border:3px solid transparent}
.team.act{border-color:var(--sun)}
.team .pts{font-family:var(--f-display);font-size:2rem;color:var(--sun)}

/* onda */
.dial{width:100%;max-width:560px;margin:0 auto;display:block;touch-action:none}
.spectrum{display:flex;justify-content:space-between;gap:10px;font-weight:800;font-size:clamp(1rem,3vw,1.4rem)}
.spectrum span:first-child{color:var(--teal)}
.spectrum span:last-child{color:var(--coral);text-align:right}

/* dibujo */
.canvas-box{position:relative;width:100%;max-width:560px;margin:0 auto;aspect-ratio:1;background:#fffaf0;border-radius:16px;overflow:hidden;touch-action:none}
.canvas-box canvas{width:100%;height:100%;display:block}
.pal{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pal button{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.pal button.on{border-color:var(--ink)}
.feed{max-height:260px;overflow:auto}

/* teléfono */
.phone{max-width:520px;margin:0 auto;width:100%}
.buzz{width:min(78vw,300px);aspect-ratio:1;border-radius:50%;background:var(--coral);box-shadow:0 10px 0 #a63a2b, 0 0 40px rgba(255,106,85,.5);font-family:var(--f-display);font-size:2.4rem;color:#2d0b05;margin:10px auto;display:grid;place-items:center}
.buzz:active{transform:translateY(8px);box-shadow:0 2px 0 #a63a2b}
.secret{min-height:220px;border-radius:22px;background:var(--stage-3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;width:100%}
input[type=range]{width:100%;accent-color:var(--pink);padding:0;border:0;background:none}
.yr{font-family:var(--f-display);font-size:3.4rem;color:var(--sun);text-align:center}

.tcard{background:var(--ink);color:#1b1033;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;max-width:420px;width:100%;margin:0 auto;box-shadow:0 6px 0 var(--coral)}
.tcard .tw{font-family:var(--f-display);font-size:clamp(1.6rem,6vw,2.4rem);text-align:center;color:var(--stage);word-break:break-word}
.tcard .tf{display:flex;flex-direction:column;gap:6px;border-top:3px dashed rgba(27,16,51,.25);padding-top:10px}
.tcard .tf span{font-weight:800;font-size:1.1rem;color:#b3261e;text-align:center}
.hang{width:100%;max-width:280px;margin:0 auto;display:block}
.hmask{font-family:var(--f-display);font-size:clamp(1.6rem,5vw,2.8rem);letter-spacing:.18em;color:var(--sun);word-break:break-word;line-height:1.3}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.keys button{font-family:var(--f-display);font-size:1.2rem;padding:10px 0;border-radius:10px;background:var(--stage-3)}
.keys button[disabled]{opacity:.25}
.blank{color:var(--sun);border-bottom:3px solid var(--sun);padding:0 .3em}
.bubble{background:var(--stage-3);border-radius:16px;padding:14px 18px;display:flex;flex-direction:column;gap:4px;max-width:640px;margin:0 auto;width:100%}
.btab{border-collapse:separate;border-spacing:6px;min-width:100%}
.btab th{text-align:left;font-size:.85rem;color:var(--muted);font-weight:700;white-space:nowrap;padding:0 4px}
.btab td{vertical-align:top}
.bcell{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:10px;font-weight:700;min-width:110px;text-align:left;width:100%}
.bcell small{font-family:var(--f-display);font-size:.9rem}
.bcell.uni{background:color-mix(in srgb,var(--ok) 28%,var(--stage-3))}
.bcell.rep{background:color-mix(in srgb,var(--sun) 28%,var(--stage-3))}
.bcell.nul{background:var(--stage-3);color:var(--muted);text-decoration:line-through}
.bcell.empty{background:transparent;color:var(--muted)}
.fcard{display:inline-flex;flex-direction:column;justify-content:space-between;gap:6px;padding:10px 12px;border-radius:12px;color:#1b1033;font-weight:800;min-width:110px;min-height:74px;font-size:.95rem;box-shadow:inset 0 0 0 3px rgba(27,16,51,.15)}
.fcard small{font-weight:600;opacity:.8}
.frow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--stage-3);font-weight:700;text-align:left;border:3px solid transparent;width:100%}
.frow.on{border-color:var(--fc);background:color-mix(in srgb,var(--fc) 25%,var(--stage-3))}
.frow b{margin-left:auto;font-family:var(--f-display);font-size:1.3rem}
.fsw{width:26px;height:34px;border-radius:6px;background:var(--fc);flex:none}
.note{border-left:4px solid var(--sun);padding:8px 12px;background:var(--stage-3);border-radius:0 10px 10px 0;font-size:.92rem}
@media (max-width:520px){ .teams{grid-template-columns:1fr} .q{font-size:1.3rem} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
<div id="app"></div>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
const safeColor = c => COLORS.includes(c) ? c : COLORS[0];
function lev(a, b) { const m = a.length, n = b.length; if (!m) return n; if (!n) return m; let prev = Array.from({length:n+1}, (_, i) => i); for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1)); prev = cur; } return prev[n]; }
function matches(input, cands) {
  const inp = norm(input); if (!inp) return false;
  return cands.map(norm).some(c => {
    if (!c) return false;
    if (inp === c) return true;
    if (c.length > 3 && (' ' + inp + ' ').includes(' ' + c + ' ')) return true;
    if (inp.length > 3 && c.includes(inp) && inp.length >= c.length * 0.6) return true;
    const tol = c.length > 7 ? 2 : c.length > 3 ? 1 : 0;
    return lev(inp, c) <= tol;
  });
}

let peerLib = null;
function loadPeerJS() {
  if (window.Peer) return Promise.resolve();
  if (peerLib) return peerLib;
  peerLib = new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'; sc.onload = res; sc.onerror = () => { peerLib = null; rej(Object.assign(new Error('peerjs'), { code: 'sin-internet' })); }; document.head.appendChild(sc); });
  return peerLib;
}
function mergePres(cur, patch) { const n = { ...cur }; for (const k in patch) { if (patch[k] === null) delete n[k]; else n[k] = patch[k]; } return n; }
function peerApi(snap, cbs, setMy, destroy) {
  return {
    peers: snap,
    onPeers(f) { cbs.add(f); setTimeout(() => { const pe = snap(); f({ peers: pe, joined: pe, left: [], updated: [] }); }, 0); return () => cbs.delete(f); },
    presence(patch) { setMy(patch); return Promise.resolve(); },
    leave() { cbs.clear(); destroy(); return Promise.resolve(); },
  };
}
async function peerHost(code) {
  await loadPeerJS();
  return new Promise((resolve, reject) => {
    const peer = new window.Peer(PEER_PREFIX + code);
    const conns = new Map(), pres = new Map(), cbs = new Set(); let my = {}, t = null, opened = false;
    const snap = () => [{ peer: 'host', sameTab: true, isMe: true, presence: my }, ...[...pres].map(([id, p]) => ({ peer: id, sameTab: false, isMe: false, presence: p }))];
    const fire = (j = [], l = [], u = []) => { const ch = { peers: snap(), joined: j, left: l, updated: u }; cbs.forEach(f => { try { f(ch); } catch (e) { console.error(e); } }); };
    const sendAll = () => { const m = { t: 'host', p: my }; conns.forEach(c => { try { if (c.open) c.send(m); } catch (e) {} }); };
    const api = peerApi(snap, cbs, patch => { my = mergePres(my, patch); if (!t) t = setTimeout(() => { t = null; sendAll(); }, 30); }, () => { try { peer.destroy(); } catch (e) {} });
    peer.on('open', () => { opened = true; resolve(api); });
    peer.on('error', e => { if (!opened) reject(Object.assign(new Error(e.type), { code: e.type })); });
    peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
    api.dm = (to, data) => { const c = conns.get(to); try { if (c && c.open) c.send({ t: 'dm', d: data }); } catch (e) {} };
    peer.on('connection', conn => {
      conn.on('open', () => { conns.set(conn.peer, conn); try { conn.send({ t: 'host', p: my }); } catch (e) {} });
      conn.on('data', d => {
        if (!d || d.t !== 'pres' || typeof d.p !== 'object' || d.p === null) return;
        const had = pres.has(conn.peer); pres.set(conn.peer, d.p);
        const e = { peer: conn.peer, presence: d.p }; had ? fire([], [], [e]) : fire([e]);
      });
      const gone = () => { conns.delete(conn.peer); if (pres.delete(conn.peer)) fire([], [{ peer: conn.peer }]); };
      conn.on('close', gone); conn.on('error', gone);
    });
  });
}
async function peerPhone(code) {
  await loadPeerJS();
  return new Promise((resolve, reject) => {
    const peer = new window.Peer();
    const cbs = new Set(); let my = {}, host = null, conn = null, myId = 'yo', t = null, done = false;
    const snap = () => { const a = [{ peer: myId, sameTab: true, isMe: true, presence: my }]; if (host) a.push({ peer: 'host', sameTab: false, isMe: false, presence: host }); return a; };
    const fire = () => { const ch = { peers: snap(), joined: [], left: [], updated: [] }; cbs.forEach(f => { try { f(ch); } catch (e) { console.error(e); } }); };
    const api = peerApi(snap, cbs, patch => { my = mergePres(my, patch); if (!t) t = setTimeout(() => { t = null; try { if (conn && conn.open) conn.send({ t: 'pres', p: my }); } catch (e) {} }, 30); }, () => { try { peer.destroy(); } catch (e) {} });
    const dmCbs = new Set(); api.onDm = f => dmCbs.add(f);
    const fail = code => { if (done) return; done = true; try { peer.destroy(); } catch (e) {} reject(Object.assign(new Error(code), { code })); };
    peer.on('open', id => {
      myId = id;
      conn = peer.connect(PEER_PREFIX + code, { reliable: true, serialization: 'json' });
      conn.on('open', () => { if (done) return; done = true; try { conn.send({ t: 'pres', p: my }); } catch (e) {} resolve(api); });
      conn.on('data', d => { if (d && d.t === 'host' && d.p && typeof d.p === 'object') { host = d.p; fire(); } else if (d && d.t === 'dm' && d.d) dmCbs.forEach(f => { try { f(d.d); } catch (e) {} }); });
      conn.on('close', () => { host = null; fire(); });
    });
    peer.on('error', e => fail(e.type));
    setTimeout(() => fail('timeout'), 15000);
  });
}
const NET_ERR = { 'peer-unavailable': 'No existe una sala con ese código. Revisa las letras.', 'timeout': 'La sala no respondió. Revisa el código y que ambos tengan internet.', 'sin-internet': 'No se pudo cargar la conexión. Revisa tu internet.', 'network': 'Problema de red. Intenta de nuevo.', 'browser-incompatible': 'Este navegador no permite la conexión directa.' };
const netMsg = e => NET_ERR[e && e.code] || ('Error de conexión (' + ((e && e.code) || 'desconocido') + ').');

const P = { dm: {}, bAns: {}, st: null, sig: '', me: null, host: false, sent: {}, strokes: [], cur: null, sid: 0, clr: 0, pen: 0, gn: 0, peek: false, at: 0 };

async function joinRoom(code, role) {
  if (NR) { try { await NR.leave(); } catch (e) {} NR = null; }
  if (TRANSPORT === 'room') NR = await ROOM.join('noche-' + code.toLowerCase());
  else if (TRANSPORT === 'peer') NR = role === 'host' ? await peerHost(code) : await peerPhone(code);
  else throw Object.assign(new Error('sin sala'), { code: 'sin-sala' });
  return NR;
}
const newCode = () => Array.from({ length: 4 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random() * 24)]).join('');

function hostPlayers() {
  if (!NR) return [];
  return NR.peers().filter(p => !p.sameTab && p.presence && p.presence.role === 'player' && typeof p.presence.name === 'string')
    .map(p => ({ id: p.peer, name: String(p.presence.name).slice(0, 16), color: safeColor(p.presence.color) }));
}
function roster() { return S.mode === 'host' ? hostPlayers() : S.players; }
function addPts(name, n) { S.scores[name] = (S.scores[name] || 0) + n; save(); }
function scoreOf(name) { return S.scores[name] || 0; }

let lastPub = null;
function pub(st) {
  lastPub = st;
  if (S.mode !== 'host' || !NR) return;
  const sc = {}; hostPlayers().forEach(p => sc[p.name] = scoreOf(p.name));
  NR.presence({ role: 'host', code: S.code, st: { ...st, sc } }).catch(e => console.warn('presence', e && e.message));
}

function onHostPeers(ch) {
  const g = S.g;
  for (const p of ch.peers) {
    if (p.sameTab || !p.presence || p.presence.role !== 'player') continue;
    const name = String(p.presence.name || '').slice(0, 16);
    if (name && !(name in S.scores)) S.scores[name] = 0;
    const a = p.presence.a;
    if (g && a && a.k === g.key) {
      const sig = JSON.stringify(a);
      if (S.seen[p.peer] !== sig) { S.seen[p.peer] = sig; const G = GAMES[g.id]; G.onAnswer && G.onAnswer({ id: p.peer, name, color: safeColor(p.presence.color) }, a); }
    }
    if (g && g.id === 'draw' && p.presence.dr && p.presence.dr.k === g.key && g.drawer && p.peer === g.drawer.id) drawIngest(p.presence.dr);
    if (g && g.id === 'tel' && p.presence.dr && p.presence.dr.k === g.key) telIngest(p.peer, p.presence.dr);
    if (g && g.id === 'tel' && p.presence.need === g.key) GAMES.tel.resend(p.peer);
  }
  if (ch.joined.length || ch.left.length) { if (lastPub) pub(lastPub); render(); }
  else if (S.view !== 'game') render();
}

function onPhonePeers(ch) {
  const me = ch.peers.find(p => p.sameTab); if (me) P.me = me.peer;
  const host = ch.peers.find(p => p.presence && p.presence.role === 'host');
  P.host = !!host;
  const st = host ? host.presence.st : null;
  const sig = JSON.stringify(st);
  if (sig !== P.sig) {
    const prev = P.st;
    P.sig = sig; P.st = st;
    if (!prev || !st || prev.k !== st.k || prev.ph !== st.ph) P.at = Date.now();
    if (!prev || !st || prev.k !== st.k) { P.peek = false; }
    if (st && (st.t === 'draw' || st.t === 'tel') && (!prev || prev.k !== st.k)) { P.strokes = []; P.cur = null; P.clr = 0; }
    render();
  }
}

// ===================== temporizador =====================
const T = { end: 0, cb: null, fired: true };
function startTimer(sec, cb) { T.end = Date.now() + sec * 1000; T.cb = cb; T.fired = false; }
function stopTimer() { T.fired = true; T.cb = null; }
function tLeft() { return T.fired ? 0 : Math.max(0, Math.ceil((T.end - Date.now()) / 1000)); }
function tick() {
  const now = Date.now();
  document.querySelectorAll('[data-end]').forEach(el => { const s = Math.max(0, Math.ceil((+el.dataset.end - now) / 1000)); el.textContent = fmt(s); el.classList.toggle('low', s <= 5 && s > 0); });
  if (!T.fired && now >= T.end) { T.fired = true; const cb = T.cb; T.cb = null; cb && cb(); }
  if (S.g && GAMES[S.g.id] && GAMES[S.g.id].tick) GAMES[S.g.id].tick();
}
setInterval(tick, 200);
const timerEl = () => `<div class="timer" data-end="${T.end}">${fmt(tLeft())}</div>`;
const phoneTimer = st => st && st.dur ? `<div class="timer" data-end="${P.at + st.dur * 1000}">${fmt(st.dur)}</div>` : '';

// ===================== render =====================
const AFTER = [];
function render() {
  const ae = document.activeElement; let keep = null;
  if (ae && ae.id && ae.tagName === 'INPUT' && ae.type !== 'range') keep = { id: ae.id, v: ae.value, s: ae.selectionStart, e: ae.selectionEnd };
  let html = '';
  try { html = VIEWS[S.view](); } catch (e) { console.error(e); html = `<div class="panel">Algo falló al dibujar esta pantalla. <button class="btn" data-a="menu">Volver al menú</button></div>`; }
  $app.innerHTML = html;
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.value = keep.v; el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch (e) {} } }
  while (AFTER.length) { try { AFTER.shift()(); } catch (e) { console.error(e); } }
  tick();
  if (S.booted) syncHash();
}

const GAMES = {};
function newGame(id, extra = {}) { S.g = { id, key: '', ...extra }; S.seen = {}; S.view = 'game'; }
function nextKey() { S.g.key = S.g.id + '-' + (++S.kc) + '-' + Math.random().toString(36).slice(2, 6); S.seen = {}; }

// ---------- TRIVIA ----------
GAMES.trivia = {
  start() {
    const qs = shuffle(TRIVIA.filter(q => S.adult || !q.x)).slice(0, S.cfg.trivN);
    newGame('trivia', { qs, i: 0 }); this.ask();
  },
  ask() {
    const g = S.g; nextKey(); g.ph = 'q'; g.ans = {}; g.right = {};
    const q = g.qs[g.i]; g.opts = shuffle([0, 1, 2, 3]); g.c = g.opts.indexOf(q.a);
    if (S.mode === 'host') startTimer(S.cfg.trivT, () => this.reveal()); else stopTimer();
    this.pub(); render();
  },
  pub() { const g = S.g, q = g.qs[g.i]; pub({ t: 'trivia', k: g.key, ph: g.ph === 'q' ? 'q' : 'r', q: q.q, o: g.opts.map(i => q.o[i]), dur: g.ph === 'q' ? tLeft() : 0, c: g.ph === 'q' ? undefined : g.c, pts: g.pts, n: g.i + 1, of: g.qs.length }); },
  onAnswer(p, a) {
    const g = S.g; if (g.ph !== 'q' || g.ans[p.id]) return; const v = +a.v; if (!(v >= 0 && v < 4)) return;
    g.ans[p.id] = { v, left: Math.max(0, (T.end - Date.now()) / 1000), name: p.name };
    if (Object.keys(g.ans).length >= hostPlayers().length) this.reveal(); else render();
  },
  reveal() {
    const g = S.g; if (g.ph !== 'q') return; stopTimer(); g.ph = 'r'; g.pts = {};
    if (S.mode === 'host') for (const [id, an] of Object.entries(g.ans)) { const pts = an.v === g.c ? Math.round((500 + 500 * an.left / S.cfg.trivT) / 10) * 10 : 0; g.pts[id] = pts; if (pts) addPts(an.name, pts); }
    this.pub(); render();
  },
  next() {
    const g = S.g;
    if (S.mode !== 'host') for (const id of Object.keys(g.right)) { const p = S.players.find(x => x.id === id); if (p) addPts(p.name, 100); }
    g.i++; if (g.i >= g.qs.length) { g.ph = 'end'; pub({ t: 'wait', msg: 'Terminó la trivia' }); render(); } else this.ask();
  },
  view() {
    const g = S.g;
    if (g.ph === 'end') return endView('Fin de la trivia');
    const q = g.qs[g.i];
    const host = S.mode === 'host';

// ---------- ONDA ----------
function dialPt(v, rad = 90) { const t = Math.PI * (1 - v / 100); return [100 + rad * Math.cos(t), 100 - rad * Math.sin(t)]; }
function wedge(a, b, fill) { a = Math.max(0, a); b = Math.min(100, b); if (b <= a) return ''; const [x1, y1] = dialPt(a), [x2, y2] = dialPt(b); return `<path d="M100 100 L${x1.toFixed(1)} ${y1.toFixed(1)} A90 90 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z" fill="${fill}"/>`; }
function dialSVG({ target, guess, guesses, id }) {
  let bands = '';
  if (target !== undefined) bands = wedge(target - 17, target + 17, 'var(--teal)') + wedge(target - 11, target + 11, 'var(--sun)') + wedge(target - 5, target + 5, 'var(--coral)');
  const needle = v => { const [x, y] = dialPt(v, 86); return `<line x1="100" y1="100" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/><circle cx="100" cy="100" r="8" fill="var(--ink)"/>`; };
  const marks = (guesses || []).map(gs => { const [x, y] = dialPt(gs.v, 96); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="${gs.c}" stroke="var(--stage)" stroke-width="1.5"><title>${esc(gs.n)}: ${gs.v}</title></circle>`; }).join('');
  return `<svg class="dial" ${id ? `id="${id}"` : ''} viewBox="-4 -4 208 112" role="img" aria-label="Dial">
    <path d="M10 100 A90 90 0 0 1 190 100 Z" fill="var(--stage-3)"/>${bands}
    <path d="M10 100 A90 90 0 0 1 190 100" fill="none" stroke="var(--line)" stroke-width="2"/>
    ${guess !== undefined ? needle(guess) : ''}${marks}</svg>`;
}
const waveScore = (g, t) => { const d = Math.abs(g - t); return d <= 5 ? 100 : d <= 11 ? 75 : d <= 17 ? 50 : 0; };
GAMES.wave = {
  start() { newGame('wave', { list: shuffle(WAVES.filter(w => S.adult || !w[2])), i: 0, pi: 0 }); this.round(); },
  round() {
    const g = S.g, r = roster(); nextKey();
    g.card = g.list[g.i % g.list.length]; g.tg = 5 + Math.floor(Math.random() * 91);
    g.psy = r[g.pi % r.length]; g.ph = 'clue'; g.dial = 50; g.guesses = {}; g.pts = null; g.peek = false; stopTimer();
    this.pub(); render();
  },
  pub() { const g = S.g; pub({ t: 'wave', k: g.key, ph: g.ph, l: g.card[0], r: g.card[1], ps: g.psy.id, psn: g.psy.name, tg: g.tg, pts: g.pts }); },
  open() { S.g.ph = 'guess'; this.pub(); render(); },
  onAnswer(p, a) { const g = S.g; if (g.ph !== 'guess' || p.id === g.psy.id) return; const v = Math.round(+a.v); if (!(v >= 0 && v <= 100)) return; g.guesses[p.id] = { v, n: p.name, c: p.color }; if (Object.keys(g.guesses).length >= hostPlayers().length - 1) this.reveal(); else render(); },
  reveal() {
    const g = S.g; if (g.ph === 'res') return; g.ph = 'res'; g.pts = {};
    if (S.mode === 'host') {
      const vals = Object.entries(g.guesses); let sum = 0;
      vals.forEach(([id, gs]) => { const s = waveScore(gs.v, g.tg); g.pts[id] = s; sum += s; if (s) addPts(gs.n, s); });
      const ps = vals.length ? Math.round(sum / vals.length / 5) * 5 : 0; g.pts[g.psy.id] = ps; if (ps) addPts(g.psy.name, ps);
    } else { const s = waveScore(g.dial, g.tg); g.pts.local = s; if (s) addPts(g.psy.name, s); }
    this.pub(); render();
  },
  next() { S.g.i++; S.g.pi++; this.round(); },
  view() {
    const g = S.g, host = S.mode === 'host';
    const spec = `<div class="spectrum"><span>← ${esc(g.card[0])}</span><span>${esc(g.card[1])} →</span></div>`;
    if (g.ph === 'res') {
      const gl = host ? Object.values(g.guesses) : [];
      return `<div class="stagebox">${spec}${dialSVG({ target: g.tg, guess: host ? undefined : g.dial, guesses: gl })}
        <p style="text-align:center">Objetivo: <b style="color:var(--sun)">${g.tg}</b>${host ? '' : ` · Dial: <b>${g.dial}</b> · <b style="color:var(--sun)">+${g.pts.local}</b> para ${esc(g.psy.name)}`}</p>
        ${host ? `<div class="list">${gl.sort((a, b) => Math.abs(a.v - g.tg) - Math.abs(b.v - g.tg)).map(x => `<div class="li"><span class="dot" style="background:${x.c}"></span>${esc(x.n)} <span class="muted">${x.v}</span><b>+${waveScore(x.v, g.tg)}</b></div>`).join('')}<div class="li">${esc(g.psy.name)} <span class="muted">psíquico, promedio</span><b>+${g.pts[g.psy.id] || 0}</b></div></div>` : ''}
        <div class="row center"><button class="btn big" data-a="g" data-f="next">Siguiente ronda</button></div></div>`;
    }

      <p style="text-align:center"><span class="eyebrow">Psíquico</span><br><b style="font-size:1.4rem">${esc(g.psy.name)}</b> ve el objetivo en su celular y da una pista en voz alta.</p>
      ${spec}${dialSVG({})}
      ${g.ph === 'clue' ? `<div class="row center"><button class="btn big" data-a="g" data-f="open">Ya dio la pista: ¡a adivinar!</button></div>`
        : `<p class="muted" style="text-align:center">Todos mueven el dial en su celular. ${Object.keys(g.guesses).length} de ${Math.max(0, hostPlayers().length - 1)} enviaron.</p><div class="row center"><button class="btn" data-a="g" data-f="reveal">Revelar</button></div>`}</div>`;
    AFTER.push(dialDragInit);
    return `<div class="stagebox">
      <p style="text-align:center"><span class="eyebrow">Psíquico</span><br><b style="font-size:1.4rem">${esc(g.psy.name)}</b></p>
      ${spec}${dialSVG({ guess: g.dial, id: 'dd' })}
      <p class="muted" style="text-align:center">${g.ph === 'clue' ? 'El psíquico mira el objetivo a solas y da una pista. Luego el grupo arrastra la aguja.' : 'Arrastren la aguja donde crean que está el objetivo.'}</p>
      <div class="row center"><button class="btn alt" data-a="wavePeek">Ver objetivo (solo el psíquico)</button><button class="btn big" data-a="g" data-f="reveal">Revelar</button></div>
      ${g.peek ? `<div class="cover"><span class="eyebrow">Solo ${esc(g.psy.name)}</span>${spec}${dialSVG({ target: g.tg })}<button class="btn big" data-a="wavePeek">Ocultar</button></div>` : ''}</div>`;
  },
};
function dialDragInit() {
  const svg = document.getElementById('dd'); if (!svg) return;
  const set = e => {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    let t = Math.atan2(100 - p.y, p.x - 100); if (t < 0) t = p.x < 100 ? Math.PI : 0;
    S.g.dial = Math.round(Math.min(100, Math.max(0, 100 * (1 - t / Math.PI))));
    const [x, y] = dialPt(S.g.dial, 86); const ln = svg.querySelector('line'); if (ln) { ln.setAttribute('x2', x.toFixed(1)); ln.setAttribute('y2', y.toFixed(1)); }
  };
  let down = false;
  svg.addEventListener('pointerdown', e => { down = true; svg.setPointerCapture(e.pointerId); set(e); });
  svg.addEventListener('pointermove', e => { if (down) set(e); });
  svg.addEventListener('pointerup', () => { down = false; });
}

// ---------- DIBUJA Y ADIVINA ----------
function drawStrokes(ctx, strokes, W) {
  ctx.fillStyle = '#fffaf0'; ctx.fillRect(0, 0, W, W);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const s of strokes) {
    const p = s.p; if (!p || p.length < 2) continue;
    ctx.strokeStyle = s.c === 9 ? '#fffaf0' : (PEN[s.c] || PEN[0]); ctx.lineWidth = (s.w || 1) * W / 120;
    ctx.beginPath(); ctx.moveTo(p[0] * W / 1000, p[1] * W / 1000);
    if (p.length === 2) ctx.lineTo(p[0] * W / 1000 + .1, p[1] * W / 1000);
    for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i] * W / 1000, p[i + 1] * W / 1000);
    ctx.stroke();
  }
}
function canvasDrawing(cv, onStroke) {
  const pos = e => { const r = cv.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * 1000), Math.round((e.clientY - r.top) / r.height * 1000)]; };
  let down = false;
  cv.addEventListener('pointerdown', e => { down = true; cv.setPointerCapture(e.pointerId); onStroke('start', pos(e)); });
  cv.addEventListener('pointermove', e => { if (down) onStroke('move', pos(e)); });
  const up = () => { if (down) { down = false; onStroke('end'); } };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
}
function drawIngest(dr) {
  const g = S.g; if (!g.strokes) return;
  if (dr.clr !== g.clr) { g.strokes.clear(); g.clr = dr.clr; }
  if (Array.isArray(dr.s)) for (const s of dr.s) if (s && typeof s.i === 'number' && Array.isArray(s.p)) g.strokes.set(s.i, { c: +s.c || 0, w: +s.w || 1, p: s.p.slice(0, 400).map(Number) });
  hostCanvasRedraw();
}

GAMES.rosco = {
  start() { newGame('rosco', { ph: 'setup' }); pub({ t: 'screen', msg: 'El Rosco se juega en la pantalla principal.' }); render(); },
  begin() {
    const g = S.g; const idx = shuffle([0, 1, 2]).slice(0, 2);
    g.teams = [0, 1].map(t => ({ name: S.teams[t], ro: ROSCOS[idx[t]], st: Array(25).fill(0), pos: 0, time: S.cfg.roscoT }));
    g.cur = 0; g.run = false; g.peek = false; g.ph = 'play'; g.last = Date.now(); render();
  },
  tick() {
    const g = S.g; if (g.ph !== 'play') return; const now = Date.now(); const dt = (now - g.last) / 1000; g.last = now;
    if (!g.run) return;
    const tm = g.teams[g.cur]; tm.time = Math.max(0, tm.time - dt);
    const el = document.getElementById('rt' + g.cur); if (el) el.textContent = Math.ceil(tm.time);
    if (tm.time <= 0) { g.run = false; this.switchTeam(); }
  },
  pending(t) { return t.st.some(x => x === 0); },
  advance(t) { for (let k = 1; k <= 25; k++) { const j = (t.pos + k) % 25; if (t.st[j] === 0) { t.pos = j; return; } } },
  act(kind) {
    const g = S.g, t = g.teams[g.cur]; if (g.ph !== 'play') return;
    if (!g.run && kind !== 'start') return;
    if (kind === 'start') { g.run = true; g.last = Date.now(); render(); return; }
    g.peek = false;
    if (kind === 'ok') { t.st[t.pos] = 1; if (!this.pending(t)) { g.run = false; this.finish(); return; } this.advance(t); render(); return; }
    if (kind === 'bad') t.st[t.pos] = 2;
    if (this.pending(t)) this.advance(t);
    g.run = false; this.switchTeam();
  },
  switchTeam() {
    const g = S.g; const o = 1 - g.cur;
    const can = t => t.time > 0 && this.pending(t);
    if (can(g.teams[o])) g.cur = o; else if (!can(g.teams[g.cur])) { this.finish(); return; }
    render();
  },
  finish() { const g = S.g; g.ph = 'end'; g.run = false; render(); },
  view() {
    const g = S.g;
    if (g.ph === 'setup') return teamSetup('Cada equipo recibe un rosco distinto. Lee la pista; el equipo responde. Error o "pasapalabra" le da el turno al otro equipo.', 'Tiempo por equipo (seg)', 'roscoT');
    const count = t => ({ ok: t.st.filter(x => x === 1).length, bad: t.st.filter(x => x === 2).length });
    if (g.ph === 'end') {
      const [a, b] = g.teams.map(count);
      const w = a.ok !== b.ok ? (a.ok > b.ok ? 0 : 1) : a.bad !== b.bad ? (a.bad < b.bad ? 0 : 1) : -1;
      return `<div class="stagebox" style="align-items:center;text-align:center"><span class="eyebrow">Fin del rosco</span><div class="big-word">${w < 0 ? 'Empate' : esc(g.teams[w].name)}</div>
        <div class="teams" style="width:100%">${g.teams.map((t, i) => { const c = count(t); return `<div class="team"><b>${esc(t.name)}</b><span class="pts">${c.ok}</span><span class="muted">${c.bad} errores · ${t.ro.n}</span></div>`; }).join('')}</div>
        <div class="row center"><button class="btn big" data-a="g" data-f="begin">Otro rosco</button><button class="btn alt" data-a="menu">Menú</button></div></div>`;
    }
    const t = g.teams[g.cur]; const L = t.ro.l[t.pos];
    const R = 175, cx = 200, cy = 200;
    const circles = t.ro.l.map((l, i) => {
      const a = -Math.PI / 2 + i * 2 * Math.PI / 25; const x = cx + R * Math.cos(a), y = cy + R * Math.sin(a);
      const st = t.st[i]; const fill = i === t.pos ? 'var(--sun)' : st === 1 ? 'var(--teal)' : st === 2 ? 'var(--coral)' : 'var(--blue)';
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="19" fill="${fill}"/><text x="${x.toFixed(1)}" y="${(y + 5.5).toFixed(1)}" text-anchor="middle" fill="#1b1033">${l[0]}</text>`;
    }).join('');
    return `<div class="stagebox">
      <div class="teams">${g.teams.map((tm, i) => { const c = count(tm); return `<div class="team ${i === g.cur ? 'act' : ''}"><b>${esc(tm.name)}</b><span class="pts"><span id="rt${i}">${Math.ceil(tm.time)}</span><span class="small muted"> seg</span></span><span class="muted">${c.ok} aciertos · ${c.bad} errores</span></div>`; }).join('')}</div>
      <div class="rosco-wrap">
        <svg class="rosco" viewBox="0 0 400 400" role="img" aria-label="Rosco de ${esc(t.name)}">${circles}<text x="200" y="196" text-anchor="middle" fill="var(--sun)" style="font-size:64px">${L[0]}</text><text x="200" y="232" text-anchor="middle" fill="var(--muted)" style="font-family:var(--f-body);font-size:16px;font-weight:700">${L[1] === 'Contiene' ? 'CONTIENE LA' : 'EMPIEZA CON'} ${L[0]}</text></svg>
        <div class="stack">
          <span class="eyebrow">${L[1]} con ${L[0]}</span>
          <p class="q">${esc(L[2])}</p>

          ${g.run ? `<div class="row"><button class="btn ok big" data-a="rosco" data-v="ok">Acierto</button><button class="btn bad big" data-a="rosco" data-v="bad">Error</button><button class="btn big" data-a="rosco" data-v="pass">Pasapalabra</button></div>`
            : `<button class="btn big" data-a="rosco" data-v="start">Turno de ${esc(t.name)}: iniciar reloj</button>`}
        </div>
      </div></div>`;
  },

GAMES.feud = {
  start() { newGame('feud', { ph: 'setup' }); pub({ t: 'screen', msg: '100 chilenos dijeron se juega en la pantalla principal.' }); render(); },
  begin() { const g = S.g; g.list = shuffle(FEUD.filter(f => S.adult || !f.x)); g.i = 0; g.tot = [0, 0]; this.round(); },
  round() { const g = S.g; g.sv = g.list[g.i % g.list.length]; g.rev = g.sv.a.map(() => false); g.flip = -1; g.strikes = 0; g.bank = 0; g.team = -1; g.ph = 'pick'; g.mult = g.i >= 4 ? 3 : g.i >= 3 ? 2 : 1; g.msg = ''; render(); },
  play(t) { S.g.team = t; S.g.ph = 'play'; render(); },
  find(txt) { const g = S.g; return g.sv.a.findIndex((a, i) => !g.rev[i] && matches(txt, [a[0], ...a[2]])); },
  open(i) { const g = S.g; if (g.rev[i]) return false; g.rev[i] = true; g.flip = i; if (g.ph === 'play' || g.ph === 'steal') g.bank += g.sv.a[i][1] * g.mult; return true; },
  guess(txt) {

    }
  },
  strike(txt) { const g = S.g; g.strikes++; g.msg = txt ? `“${txt}” no está en la encuesta.` : ''; showX(); if (g.strikes >= 3) { g.ph = 'steal'; } render(); },
  tile(i) { const g = S.g; if (g.ph === 'pick' || g.rev[i]) return; this.open(i); if (g.ph === 'steal') return this.win(1 - g.team); if (g.ph === 'play' && g.rev.every(Boolean)) return this.win(g.team); render(); },
  win(t) { const g = S.g; g.tot[t] += g.bank; g.winner = t; g.ph = 'done'; render(); },
  revealAll() { const g = S.g; g.rev = g.rev.map(() => true); g.flip = -1; render(); },
  next() { S.g.i++; this.round(); },
  view() {

const DMBUF = {};
async function dmSend(to, obj) {
  if (!NR) return;
  if (TRANSPORT === 'peer') { NR.dm && NR.dm(to, obj); return; }
  const str = JSON.stringify(obj), id = Math.random().toString(36).slice(2, 8), size = 2800, n = Math.max(1, Math.ceil(str.length / size));
  for (let i = 0; i < n; i++) {
    try { await NR.emit('dm', { to, id, i, n, c: str.slice(i * size, (i + 1) * size) }); }
    catch (e) { if (e && e.code === 'not_permitted') { S.dmErr = true; render(); return; } }
    await new Promise(r => setTimeout(r, 40));
  }
}
function dmListen() {
  if (!NR) return;
  const handle = obj => { if (obj && obj.k) { P.dm[obj.k] = obj; render(); } };
  if (TRANSPORT === 'peer') { NR.onDm && NR.onDm(handle); return; }
  NR.on('dm', msg => {
    const d = msg.data; if (!d || d.to !== P.me || typeof d.c !== 'string' || typeof d.id !== 'string') return;
    const b = DMBUF[d.id] || (DMBUF[d.id] = { n: +d.n, parts: [] }); b.parts[+d.i] = d.c;
    if (b.parts.filter(x => x !== undefined).length === b.n) { delete DMBUF[d.id]; try { handle(JSON.parse(b.parts.join(''))); } catch (e) {} }
  });
}

function simplifyStrokes(arr) {
  return arr.map(s => { const p = s.p || []; if (p.length <= 4) return { c: s.c, w: s.w, p: p.slice() }; const out = [p[0], p[1]]; let lx = p[0], ly = p[1];
    for (let i = 2; i < p.length; i += 2) { const x = p[i], y = p[i + 1]; if (Math.hypot(x - lx, y - ly) >= 8 || i === p.length - 2) { out.push(x, y); lx = x; ly = y; } } return { c: s.c, w: s.w, p: out }; });
}

  if (Array.isArray(dr.s)) for (const s of dr.s) if (s && typeof s.i === 'number' && Array.isArray(s.p)) b.m.set(s.i, { c: +s.c || 0, w: +s.w || 1, p: s.p.slice(0, 400).map(Number) });
}

        : `<div class="stack" style="align-items:center"><span class="small muted">${esc(e.by)} dibujó</span><div class="canvas-box" style="max-width:380px"><canvas id="tc${j}" width="600" height="600"></canvas></div></div>`).join('')}</div>
      <div class="row center"><button class="btn big" data-a="g" data-f="showNext">${g.se < ch.length - 1 ? 'Mostrar siguiente' : g.sc < g.N - 1 ? 'Siguiente cadena' : 'Terminar'}</button></div></div>`;
  },
};

// ---------- FERIA DE CACHUREOS (tipo Pit) ----------
function ding() { try { const C = window.AudioContext || window.webkitAudioContext; if (!C) return; const ac = ding.ac || (ding.ac = new C()); [880, 1320].forEach((f, i) => { const o = ac.createOscillator(), gn = ac.createGain(); o.frequency.value = f; o.type = 'triangle'; gn.gain.setValueAtTime(0.0001, ac.currentTime + i * .12); gn.gain.exponentialRampToValueAtTime(0.3, ac.currentTime + i * .12 + .02); gn.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + i * .12 + .6); o.connect(gn).connect(ac.destination); o.start(ac.currentTime + i * .12); o.stop(ac.currentTime + i * .12 + .65); }); } catch (e) {} }
const feriaCard = (t, extra = '') => `<span class="fcard" style="background:${FERIA[t][2]}">${esc(FERIA[t][0])}<small>${FERIA[t][1]} pts</small>${extra}</span>`;
GAMES.feria = {
  start() {
    if (S.mode !== 'host') { newGame('feria', { ph: 'nolocal' }); pub({ t: 'wait' }); render(); return; }
    newGame('feria', { tot: {}, round: 0 }); this.deal();
  },
  deal() {
    const g = S.g, r = hostPlayers();
    if (r.length < 3) { g.ph = 'few'; pub({ t: 'wait', msg: 'Faltan jugadores para la Feria' }); render(); return; }
    nextKey(); g.round++;
    g.players = r.slice(0, 10); const nT = g.players.length;
    let tries = 0;
    do {
      const deck = shuffle(Array.from({ length: nT }, (_, t) => Array(9).fill(t)).flat());
      g.hands = {};
      g.players.forEach((p, i) => { const h = Array(nT).fill(0); deck.slice(i * 9, i * 9 + 9).forEach(t => h[t]++); g.hands[p.id] = h; });
    } while (Object.values(g.hands).some(h => h.includes(9)) && ++tries < 50);
    g.offers = []; g.log = []; g.res = null; g.ph = 'play';
    g.players.forEach(p => { if (!(p.name in g.tot)) g.tot[p.name] = 0; });
    this.pub(); render();
  },
  pub() { const g = S.g; pub({ t: 'feria', k: g.key, ph: g.ph, h: g.hands, of: g.offers.map(o => ({ f: o.f, n: o.n, c: o.c })), res: g.res, tot: g.tot, meta: FERIA_META, r: g.round }); },
  onAnswer(p, a) {
    const g = S.g; if (g.ph !== 'play' || !a.v || typeof a.v !== 'object') return;
    const h = g.hands[p.id]; if (!h) return;
    const v = a.v, mine = g.offers.find(o => o.f === p.id);
    if (v.op === 'offer') {
      const t = Math.floor(+v.t), c = Math.floor(+v.c);
      if (mine || !(c >= 1 && c <= 4) || !(h[t] >= c)) return;
      const other = g.offers.find(o => o.f !== p.id && o.c === c);
      if (other) this.trade(other, { f: p.id, n: p.name, t, c });
      else g.offers.push({ f: p.id, n: p.name, t, c });
    } else if (v.op === 'cancel') {
      g.offers = g.offers.filter(o => o.f !== p.id);
    } else if (v.op === 'accept') {
      const t = Math.floor(+v.t); const o = g.offers.find(x => x.f === v.to);
      if (mine || !o || o.f === p.id || !(h[t] >= o.c)) return;
      this.trade(o, { f: p.id, n: p.name, t, c: o.c });
    } else if (v.op === 'bell') {
      const t = h.indexOf(9); if (t < 0) return;
      const pts = FERIA[t][1];
      g.tot[p.name] = (g.tot[p.name] || 0) + pts; addPts(p.name, pts);
      g.res = { f: p.id, n: p.name, t, pts }; g.offers = [];
      g.ph = g.tot[p.name] >= FERIA_META ? 'end' : 'res'; ding();
    } else return;
    this.pub(); render();
  },
  trade(o, b) {
    const g = S.g, ha = g.hands[o.f], hb = g.hands[b.f];
    g.offers = g.offers.filter(x => x !== o && x.f !== b.f);
    if (!ha || !hb || ha[o.t] < o.c || hb[b.t] < b.c) return;
    ha[o.t] -= o.c; hb[b.t] -= b.c; ha[b.t] += b.c; hb[o.t] += o.c;
    g.log.unshift(`${o.n} y ${b.n} cambiaron ${o.c} carta${o.c > 1 ? 's' : ''}`); g.log = g.log.slice(0, 6);
  },
  view() {
    const g = S.g;
    if (g.ph === 'nolocal') return `<div class="stagebox" style="text-align:center;align-items:center"><h2>Este juego necesita sala</h2><p class="muted" style="max-width:52ch">En la Feria cada uno esconde su mano y cambia cartas al mismo tiempo, así que se juega con celulares. Vuelve al inicio y toca <b>Crear sala</b>.</p><button class="btn big" data-a="leave">Ir al inicio</button></div>`;
    if (g.ph === 'few') return `<div class="stagebox" style="text-align:center;align-items:center"><h2>Faltan jugadores</h2><p class="muted">La Feria se juega de 3 a 10 personas. Hay ${hostPlayers().length} conectadas.</p><button class="btn big" data-a="g" data-f="deal">Reintentar</button></div>`;
    const standings = `<div class="list">${Object.entries(g.tot).sort((a, b) => b[1] - a[1]).map(([n, v]) => `<div class="stack" style="gap:4px"><div class="spread"><b>${esc(n)}</b><span>${v} / ${FERIA_META}</span></div><div class="bar" style="width:${Math.max(3, Math.min(100, v / FERIA_META * 100))}%"></div></div>`).join('')}</div>`;
    if (g.ph === 'res' || g.ph === 'end') return `<div class="stagebox" style="align-items:center;text-align:center">
      <span class="eyebrow">${g.ph === 'end' ? 'Fin de la feria' : '¡Campana!'}</span>
      <div class="big-word">${esc(g.res.n)}</div>
      <p style="font-size:1.2rem">${g.ph === 'end' ? `gana la feria con ${g.tot[g.res.n]} puntos` : `juntó 9 cartas de`}</p>
      ${g.ph === 'end' ? '' : `<div class="row center">${feriaCard(g.res.t, `<b>+${g.res.pts}</b>`)}</div>`}
      <div style="width:100%;max-width:520px">${standings}</div>
      ${g.ph === 'end' ? `<button class="btn big" data-a="g" data-f="start">Jugar de nuevo</button>` : `<button class="btn big" data-a="g" data-f="deal">Siguiente ronda</button>`}</div>`;
    return `<div class="stagebox">
      <div class="spread"><span class="pill">Ronda ${g.round} · gana el primero en llegar a ${FERIA_META}</span><span class="muted small">${g.players.length} tipos en juego</span></div>
      <p class="q" style="text-align:center">¡Griten cuántas cartas cambian!<br><span class="muted" style="font-size:.6em">En el celular: elige cartas iguales, ofrécelas y cambia con quien ofrezca la misma cantidad.</span></p>
      <div class="rosco-wrap">
        <div class="stack"><span class="eyebrow">Ofertas abiertas</span><div class="chips">${g.offers.map(o => `<span class="chip" style="font-size:1.3rem"><b>${esc(o.n)}</b> · ${o.c}</span>`).join('') || '<span class="muted">Nadie está ofreciendo ahora.</span>'}</div>
          <span class="eyebrow">Últimos cambios</span><div class="list">${g.log.map(l => `<div class="li">${esc(l)}</div>`).join('') || '<p class="muted">Todavía no hay cambios.</p>'}</div></div>
        <div class="stack"><span class="eyebrow">Puntaje</span>${standings}<div class="row" style="flex-wrap:wrap;gap:6px">${g.players.map((p, i) => feriaCard(i)).join('')}</div></div>
      </div></div>`;
  },
};
function feriaSend(v) { if (!NR || !P.st) return; P.gn++; NR.presence({ a: { k: P.st.k, v, s: P.gn } }).catch(() => {}); }

// ===================== acciones =====================
const ACT = {
  goBack() {
    const v = S.view;
    if (v === 'scores') return ACT.back();
    if (v === 'game') return ACT.menu();
    if (v === 'menu') return S.mode === 'host' ? ACT.lobby() : ACT.goLocal();
    if (v === 'hostLobby' || v === 'phone') return ACT.leave();
    return ACT.home();
  },
  home() { S.err = ''; S.view = 'home'; S.mode = null; render(); },
  toggleAdult() { S.adult = !S.adult; save(); render(); },
  goLocal() { if (S.mode === 'host' && NR) { NR.leave().catch(() => {}); NR = null; } S.mode = 'local'; S.view = 'localSetup'; render(); setTimeout(() => document.getElementById('pn')?.focus(), 0); },
  addPlayer() { const el = document.getElementById('pn'); const n = (el?.value || '').trim().slice(0, 16); if (!n || S.players.some(p => p.name === n)) return; S.players.push({ id: 'L' + Date.now() + Math.random().toString(36).slice(2, 5), name: n, color: COLORS[S.players.length % COLORS.length] }); save(); el.value = ''; render(); document.getElementById('pn')?.focus(); },
  rmPlayer(d) { S.players.splice(+d.i, 1); save(); render(); },
  async goHost() {
    if (TRANSPORT === 'none') { S.err = 'La sala con celulares no está disponible en esta vista. Usa "Jugar aquí".'; render(); return; }
    S.err = 'Creando la sala…'; render();
    let ok = false, last = null;
    for (let i = 0; i < 3 && !ok; i++) { S.code = newCode(); try { await joinRoom(S.code, 'host'); ok = true; } catch (e) { last = e; if (!e || e.code !== 'unavailable-id') break; } }
    if (!ok) { S.err = 'No se pudo crear la sala. ' + netMsg(last); render(); return; }
    S.err = '';
    S.mode = 'host'; S.view = 'hostLobby';
    NR.onPeers(onHostPeers, e => { S.err = 'Se perdió la conexión de la sala.'; });
    pub({ t: 'wait', msg: 'En el lobby' }); render();
  },
  lobby() { S.view = 'hostLobby'; pub({ t: 'wait', msg: 'En el lobby' }); render(); },
  goJoin() { if (TRANSPORT === 'none') { S.err = 'La sala con celulares no está disponible en esta vista.'; render(); return; } S.err = ''; S.view = 'join'; render(); },
  async doJoin() {
    const name = (document.getElementById('jn')?.value || '').trim().slice(0, 16);
    const code = (document.getElementById('jc')?.value || '').trim().toUpperCase();
    if (!name) { S.err = 'Escribe tu nombre.'; render(); return; }
    if (!/^[A-Z]{4}$/.test(code)) { S.err = 'El código tiene 4 letras.'; render(); document.getElementById('jc').value = code; return; }
    S.pname = name; S.code = code; save();
    S.err = 'Conectando…'; render(); document.getElementById('jc').value = code;
    try { await joinRoom(code, 'phone'); } catch (e) { S.err = netMsg(e); render(); document.getElementById('jc').value = code; return; }
    S.pcolor = COLORS[Math.floor(Math.random() * COLORS.length)];
    S.mode = 'phone'; S.view = 'phone'; S.err = '';
    NR.onPeers(onPhonePeers); dmListen();
    NR.presence({ role: 'player', name, color: S.pcolor }).catch(() => {});
    render();
  },
  async leave() { if (NR) { try { await NR.leave(); } catch (e) {} NR = null; } S.mode = null; S.g = null; S.view = 'home'; stopTimer(); render(); },
  menu() {
    if (S.mode === 'local' && S.players.length < 2) { S.view = 'localSetup'; render(); return; }
    stopTimer(); S.g = null; S.view = 'menu'; pub({ t: 'wait', msg: 'Eligiendo el siguiente juego' }); render();
  },
  startGame(d) { stopTimer(); GAMES[d.g].start(); },
  scores() { S.prevView = S.view; S.view = 'scores'; render(); },
  back() { S.view = S.prevView && S.prevView !== 'scores' ? S.prevView : 'menu'; render(); },
  adj(d) { addPts(d.n, +d.v); if (lastPub) pub(lastPub); render(); },
  resetScores() { if (S.confirmReset) { Object.keys(S.scores).forEach(k => S.scores[k] = 0); save(); S.confirmReset = false; if (lastPub) pub(lastPub); render(); } else { S.confirmReset = true; const b = document.querySelector('[data-a=resetScores]'); if (b) b.textContent = 'Toca otra vez para confirmar'; setTimeout(() => S.confirmReset = false, 3000); } },
  g(d) { const G = GAMES[S.g.id]; G[d.f] && G[d.f](); },
  trivRight(d) { const r = S.g.right; r[d.id] = !r[d.id]; render(); },
  drawRight(d) { const r = S.g.right; r[d.id] = !r[d.id]; render(); },
  songRight(d) { const r = S.g.right; r[d.id] = !r[d.id]; render(); },
  impCat(d) { S.g.cat = d.v; render(); }, impN(d) { S.g.nImp = +d.v; render(); }, impHint() { S.g.hint = !S.g.hint; render(); },
  impShow() { S.g.show = true; render(); },
  impNext() { const g = S.g; g.show = false; g.pi++; if (g.pi >= roster().length) g.ph = 'see'; render(); },
  impAccuse(d) { GAMES.imp.accuse(d.id || null); },
  wavePeek() { S.g.peek = !S.g.peek; render(); },
  drawPeek() { S.g.peek = !S.g.peek; render(); },
  lPen(d) { S.g.pen = +d.v; render(); }, lClear() { S.g.lstrokes = []; hostCanvasRedraw(); },
  songM(d) { S.g.m = d.v; render(); }, songF(d) { S.g.free = d.v === '1'; render(); },
  songPeek() { S.g.peek = !S.g.peek; render(); },
  songJudge(d) { GAMES.song.judge(d.v === '1'); },
  rosco(d) { GAMES.rosco.act(d.v); },
  roscoPeek() { S.g.peek = !S.g.peek; render(); },
  feudPlay(d) { GAMES.feud.play(+d.v); setTimeout(() => document.getElementById('fa')?.focus(), 0); },
  feudGuess() { const el = document.getElementById('fa'); const v = el ? el.value : ''; if (el) el.value = ''; GAMES.feud.guess(v); setTimeout(() => document.getElementById('fa')?.focus(), 0); },
  feudStrike() { GAMES.feud.strike(''); },
  feudTile(d) { GAMES.feud.tile(+d.i); },
  // tabú
  tabuR(d) { S.g.rounds = +d.v; render(); }, tabuS(d) { S.g.secs = +d.v; render(); },
  tabuM(d) { GAMES.tabu.mark(d.v); },
  tabuP(d) { if (P.st) opSend({ op: d.v, ci: P.st.ci }); try { navigator.vibrate && navigator.vibrate(50); } catch (e) {} },
  // ahorcado
  hangSrc(d) { S.g.src = d.v; render(); },
  hangL(d) { const p = GAMES.hang.turnP(); if (p) GAMES.hang.letter(d.v, p); },
  hangSolve() { const el = document.getElementById('hs'); const v = el ? el.value : ''; const p = GAMES.hang.turnP(); if (p && v.trim()) { el.value = ''; GAMES.hang.solve(v, p); } },
  hangSkip() { const g = S.g; g.ti++; g.mv++; g.msg = 'Turno saltado'; GAMES.hang.pub(); render(); },
  hangSet() { const el = document.getElementById('hw'); const v = (el && el.value || '').trim(); if (v.replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/g, '').length < 3) return; opSend({ op: 'set', w: v }); },
  hangPL(d) { if (P.st) opSend({ op: 'letter', l: d.v, mv: P.st.mv }); },
  hangPS() { const el = document.getElementById('hps'); const v = (el && el.value || '').trim(); if (v && P.st) { el.value = ''; opSend({ op: 'solve', t: v, mv: P.st.mv }); } },
  // chamullo
  chamN(d) { S.g.n = +d.v; render(); },
  chamLie() { const el = document.getElementById('cl'); const v = (el && el.value || '').trim(); if (!v) return; el.value = ''; opSend({ op: 'lie', t: v }); },
  chamVote(d) { if (!P.st) return; P.sent[P.st.k] = d.v; opSend({ op: 'vote', o: d.v }); render(); },
  // teléfono
  telW(d) { S.g.tw = +d.v; render(); }, telD(d) { S.g.td = +d.v; render(); },
  telIdea() { const el = document.getElementById('tt'); if (el) { el.value = pick(TEL_IDEAS); el.focus(); } },
  telDone() { const el = document.getElementById('tt'); const st = P.st; if (!st) return; const t = el ? el.value.trim() : ''; if (st.ty === 'text' && !t) { if (el) el.focus(); return; } opSend({ op: 'done', t }); },
  // basta
  bCat(d) { const g = S.g; const i = g.cats.indexOf(d.v); if (i >= 0) g.cats.splice(i, 1); else if (g.cats.length < 10) g.cats.push(d.v); render(); },
  bBad(d) { GAMES.basta.toggle(d.k); },
  bBasta() { bastaSend(true); try { navigator.vibrate && navigator.vibrate(120); } catch (e) {} },
  // feria (teléfono)
  fSel(d) { const t = +d.t; const h = P.st && P.st.h && P.st.h[P.me]; if (!h) return; P.fs = P.fs && P.fs.t === t ? null : { t, c: Math.min(h[t], P.fs ? P.fs.c : 1, 4) }; render(); },

  // teléfono
  pAns(d) { answer(d.str ? d.v : +d.v); },

  pBuzz() { answer('buzz'); try { navigator.vibrate && navigator.vibrate(60); } catch (e) {} },

  pPen(d) { P.pen = +d.v; document.querySelectorAll('.pal button[data-v]').forEach(b => b.classList.toggle('on', +b.dataset.v === P.pen)); },

};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const f = ACT[el.dataset.a]; if (f) { e.preventDefault(); f(el.dataset, el); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter) { e.preventDefault(); ACT[e.target.dataset.enter](e.target.dataset); }
  else if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('toggle')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.in; if (!k) return;

  if (k === 'yr') { P.yr = +e.target.value; const o = document.getElementById('yrv'); if (o) o.textContent = P.yr; }
  if (k === 'team0' || k === 'team1') { S.teams[+k.slice(-1)] = e.target.value.slice(0, 20) || 'Equipo'; save(); }
  if (k === 'bas' && P.st) { const st = P.st; (P.bAns[st.k] || (P.bAns[st.k] = []))[+e.target.dataset.i] = e.target.value.slice(0, 40); bastaSend(false); const ok = st.cats.every((_, i) => startsWith((P.bAns[st.k] || [])[i], st.L)); const b = document.getElementById('bbtn'); if (b) b.disabled = !ok; }
  if (k === 'btime' && S.g && S.g.id === 'basta') { S.g.time = Math.max(30, Math.min(300, +e.target.value || 90)); }
  if (k === 'cfg') { const v = Math.max(30, Math.min(600, +e.target.value || 150)); S.cfg[e.target.dataset.k] = v; save(); }
});
try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
S.booted = true;

// ----- botón atrás del navegador / celular -----
const HASH = { home: '', localSetup: 'jugadores', hostLobby: 'sala', join: 'unirme', menu: 'menu', game: 'juego', scores: 'marcador', phone: 'celular' };
function syncHash() { const h = HASH[S.view] || ''; if (location.hash.slice(1) !== h) { try { location.hash = h; } catch (e) {} } }
window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1); const t = Object.keys(HASH).find(k => HASH[k] === h) || 'home';
  if (t === S.view) return;
  if (t === 'home') return NR ? ACT.leave() : ACT.home();
  if (t === 'localSetup') return ACT.goLocal();
  if (t === 'hostLobby') return S.mode === 'host' ? ACT.lobby() : ACT.home();
  if (t === 'menu') return (S.mode === 'local' || S.mode === 'host') ? ACT.menu() : ACT.home();
  if (t === 'join') return S.mode === 'phone' ? ACT.leave() : ACT.goJoin();
  if (t === 'scores') return ACT.scores();
  if (t === 'game' && S.g) { S.view = 'game'; return render(); }
  if (t === 'phone' && S.mode === 'phone') { S.view = 'phone'; return render(); }
  syncHash();
});
if (location.hash) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }

render();
